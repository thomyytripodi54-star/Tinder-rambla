<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>RAMBLERO TINDER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --black:#0a0a0a;
    --black2:#141414;
    --red:#e10600;
    --red2:#ff2b23;
    --white:#f5f5f0;
    --gray:#9a9a94;
    --card:#191919;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--black);color:var(--white);font-family:'Inter',sans-serif;height:100%;overflow-x:hidden;}
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(225,6,0,0.12), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(225,6,0,0.10), transparent 45%),
      var(--black);
    min-height:100vh;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:30px;}

  .h-title{
    font-family:'Anton',sans-serif;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--white);
  }
  .accent{color:var(--red2);}
  .marker{font-family:'Permanent Marker',cursive;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 10px 20px;
  }
  .brand{font-size:22px;line-height:1;}
  .brand small{display:block;font-family:'Inter';font-size:10px;letter-spacing:3px;color:var(--gray);font-weight:600;}
  .crown{font-size:20px;cursor:pointer;user-select:none;}

  .screen{padding:10px 20px 40px 20px; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* LOGIN */
  .lead{font-size:26px;line-height:1.15;margin:6px 0 4px 0;}
  .sub{color:var(--gray);font-size:14px;margin-bottom:20px;}
  .grid-names{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .name-btn{
    background:var(--card);border:1px solid #2a2a2a;color:var(--white);
    padding:14px 10px;border-radius:14px;font-size:14px;font-weight:600;
    text-align:center;cursor:pointer;transition:.15s;
  }
  .name-btn:active{transform:scale(.96);border-color:var(--red);}
  .name-btn.mine{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;}

  /* BUTTONS */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 22px;border-radius:999px;font-weight:800;font-size:15px;
    border:none;cursor:pointer;width:100%;text-transform:uppercase;letter-spacing:.5px;
  }
  .btn-red{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;}
  .btn-outline{background:transparent;border:2px solid var(--red);color:var(--white);}
  .btn-ghost{background:#1f1f1f;color:var(--gray);}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .row-btns{display:flex;gap:10px;margin-top:12px;}

  /* PROFILE EDIT */
  .card-block{background:var(--card);border:1px solid #2a2a2a;border-radius:18px;padding:18px;margin-bottom:16px;}
  label.field-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray);font-weight:700;display:block;margin-bottom:8px;}
  textarea, input[type=text], select{
    width:100%;background:#0f0f0f;border:1px solid #2f2f2f;color:var(--white);
    border-radius:10px;padding:12px;font-family:'Inter';font-size:14px;resize:vertical;
  }
  .photo-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .photo-thumb{width:72px;height:96px;border-radius:10px;object-fit:cover;border:2px solid var(--red);}
  .photo-add{
    width:72px;height:96px;border-radius:10px;border:2px dashed #444;color:var(--gray);
    display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;
  }

  /* DECK */
  .deck-wrap{position:relative;height:66vh;min-height:440px;margin:10px 0 14px 0;}
  .swipe-card{
    position:absolute;inset:0;background:var(--card);border-radius:22px;overflow:hidden;
    border:1px solid #2a2a2a;box-shadow:0 20px 40px rgba(0,0,0,.5);
    display:flex;flex-direction:column;touch-action:none;user-select:none;
  }
  .photo-area{flex:1;position:relative;background:linear-gradient(160deg,#1c1c1c,#0a0a0a);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .photo-area img{width:100%;height:100%;object-fit:cover;object-position:center 15%;}
  .avatar-fallback{
    font-family:'Anton';font-size:80px;color:rgba(225,6,0,.5);
  }
  .stamp{
    position:absolute;top:22px;padding:6px 14px;border:4px solid;border-radius:8px;
    font-family:'Anton';font-size:24px;letter-spacing:2px;text-transform:uppercase;
    transform:rotate(-18deg);opacity:0;pointer-events:none;
  }
  .stamp-like{left:20px;border-color:#3ddc6b;color:#3ddc6b;}
  .stamp-pass{right:20px;border-color:var(--red2);color:var(--red2);transform:rotate(18deg);}
  .mystery-tag{
    position:absolute;bottom:10px;left:10px;right:10px;background:rgba(225,6,0,.85);
    color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;text-align:center;
  }
  .info-area{padding:16px 18px 18px 18px;}
  .p-name{font-family:'Anton';font-size:24px;margin:0 0 6px 0;}
  .p-bullets{list-style:none;margin:0 0 10px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;}
  .p-bullets li{background:#0f0f0f;border:1px solid #2f2f2f;color:var(--gray);font-size:11.5px;padding:5px 9px;border-radius:999px;}
  .ig-link{display:inline-flex;align-items:center;gap:6px;color:var(--red2);text-decoration:none;font-weight:700;font-size:13px;}

  .deck-actions{display:flex;justify-content:center;gap:22px;margin-top:6px;}
  .round-btn{
    width:60px;height:60px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:var(--black2);cursor:pointer;
  }
  .round-btn.pass{border-color:var(--red2);color:var(--red2);}
  .round-btn.like{border-color:#3ddc6b;color:#3ddc6b;}
  .round-btn:active{transform:scale(.9);}

  .progress-bar{height:4px;background:#222;border-radius:2px;overflow:hidden;margin-bottom:14px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red2));}

  /* END SCREEN */
  .likes-list{list-style:none;padding:0;margin:0 0 16px 0;}
  .likes-list li{background:var(--card);border:1px solid #2a2a2a;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-weight:600;font-size:14px;}
  .empty-note{color:var(--gray);font-size:14px;margin-bottom:16px;}
  .note-box{background:#1a0d0d;border:1px solid #3a1414;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#e0b3b0;margin-top:14px;line-height:1.5;}

  /* ADMIN */
  .admin-item{background:var(--card);border:1px solid #2a2a2a;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px;}
  .match-pill{background:linear-gradient(135deg,var(--red2),var(--red));border-radius:12px;padding:14px;margin-bottom:10px;font-weight:800;text-align:center;font-family:'Anton';font-size:18px;letter-spacing:.5px;}
  .backlink{color:var(--gray);font-size:13px;text-align:center;display:block;margin-top:18px;cursor:pointer;}

  input[type=file]{display:none;}
  .hint{font-size:12px;color:var(--gray);margin-top:6px;}
  .locked-badge{font-size:10px;color:var(--gray);text-align:center;margin-top:10px;letter-spacing:1px;}

  /* SPLASH */
  .splash{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;}
  .splash-badge{font-family:'Permanent Marker';color:var(--red2);font-size:15px;transform:rotate(-4deg);margin-bottom:6px;}
  .splash-title{font-family:'Anton';font-size:52px;line-height:.95;text-transform:uppercase;margin:0;}
  .splash-title .accent{display:block;font-size:60px;-webkit-text-stroke:2px var(--red2);color:transparent;}
  .splash-sub{color:var(--gray);font-size:14px;margin:18px 0 30px 0;max-width:300px;}
  .splash-emojis{font-size:30px;margin-bottom:22px;letter-spacing:10px;}
  .splash .btn{max-width:280px;}

  /* PHOTO CAROUSEL */
  .tap-zone{position:absolute;top:0;bottom:70px;width:50%;z-index:5;}
  .tap-zone.left{left:0;}
  .tap-zone.right{right:0;}
  .dots-row{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:5px;z-index:6;}
  .dot{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:3px;}
  .dot.active{background:#fff;}

  /* ADMIN DASHBOARD */
  .likeline{padding:10px 14px;border-radius:10px;margin-bottom:6px;font-size:14px;font-weight:600;background:#161616;border:1px solid #2a2a2a;}
  .likeline.match{background:linear-gradient(135deg,rgba(61,220,107,.18),rgba(61,220,107,.08));border-color:#3ddc6b;color:#8ff0ae;}
  .danger-btn{background:#2a0f0f;color:#ff8a85;border:1px solid #5a1f1f;}

  /* MATCH OVERLAY */
  .match-overlay{
    position:fixed;inset:0;z-index:9999;
    display:flex;align-items:center;justify-content:center;
    background:rgba(8,8,8,0);
    transition:background .35s ease;
    pointer-events:none;
    overflow:hidden;
  }
  .match-overlay.show{ background:rgba(8,8,8,.9); }
  .match-burst{
    position:relative;
    text-align:center;
    padding:0 30px;
    transform:scale(.2);
    opacity:0;
    transition:transform .5s cubic-bezier(.17,.89,.32,1.49), opacity .3s ease;
  }
  .match-overlay.show .match-burst{ transform:scale(1); opacity:1; }
  .match-overlay.hide .match-burst{ transform:scale(1.2); opacity:0; transition:transform .35s ease, opacity .35s ease; }
  .match-burst::before{
    content:'';
    position:absolute; left:50%; top:50%;
    width:40px;height:40px;
    margin:-20px 0 0 -20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(225,6,0,.6), rgba(225,6,0,0) 70%);
    transform:scale(0);
    z-index:-1;
  }
  .match-overlay.show .match-burst::before{ animation: burstRing .9s ease-out forwards; }
  @keyframes burstRing{ to{ transform:scale(16); } }
  .match-title{
    font-family:'Anton',sans-serif;
    font-size:clamp(32px, 13vw, 52px);
    line-height:1;
    letter-spacing:1px;
    color:#fff;
    -webkit-text-stroke:2px var(--red2);
    text-transform:uppercase;
  }
  .match-sub{
    font-family:'Permanent Marker',cursive;
    font-size:20px;
    color:var(--red2);
    margin-top:10px;
    transform:rotate(-3deg);
  }
  .match-spark{
    position:absolute; left:50%; top:50%; font-size:22px;
    transform:translate(-50%,-50%);
    opacity:0;
  }
  .match-overlay.show .match-spark{
    animation: sparkOut .8s ease-out forwards;
  }
  @keyframes sparkOut{
    0%{ transform:translate(-50%,-50%) scale(.4); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.4); opacity:0; }
  }
</style>
</head>

<script>
(function(){
  "use strict";
  const SEED = JSON.parse(document.getElementById('seed-data').textContent);
  const PEOPLE_BASE = SEED.people;
  const ADMIN_PASS = SEED.adminPass;

  // === CONFIGURACIÓN DE FIREBASE (backend gratis para sync en tiempo real) ===
  // 1) Entrá a console.firebase.google.com y creá un proyecto (gratis, sin tarjeta).
  // 2) Build > Firestore Database > Crear base de datos (modo producción, cualquier región).
  // 3) Pestaña "Reglas" de Firestore, pegá esto y publicá:
  //      rules_version = '2';
  //      service cloud.firestore {
  //        match /databases/{database}/documents {
  //          match /profiles/{personId} { allow read: if true; allow write: if request.auth != null; }
  //          match /swipes/{personId}   { allow read: if true; allow write: if request.auth != null; }
  //        }
  //      }
  // 4) Build > Authentication > Sign-in method > habilitá el proveedor "Anónimo".
  // 5) Ícono ⚙️ (Project settings) > "Tus apps" > ícono Web (</>) > registrá una app
  //    y copiá el objeto de config que te da acá abajo.
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCMDzETRtt8qArgAn1x0UliwL7l4M8FXKA",
    authDomain: "rambla-citas.firebaseapp.com",
    projectId: "rambla-citas",
    storageBucket: "rambla-citas.firebasestorage.app",
    messagingSenderId: "1055739021920",
    appId: "1:1055739021920:web:ba5f04ef069e46d80a1105"
  };
  const FIREBASE_CONFIGURED = FIREBASE_CONFIG.apiKey !== "TU_API_KEY";

  let db = null;
  let authReady = Promise.resolve();
  if(FIREBASE_CONFIGURED && window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    authReady = firebase.auth().signInAnonymously().catch(e=>console.error('Firebase auth falló', e));
  }
  function ensureAuth(){ return authReady; }

  const LS = { me: 'ramblero_me' }; // en qué celular sos quién: queda solo en este dispositivo
  function loadJSON(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
  }

  // ---------- SYNC EN VIVO (Firestore) ----------
  let profilesCache = {};    // id -> {name, bio, photos}
  let swipesCache = {};      // id -> {name, likes:[], passes:[]}
  let extraGuestsCache = {}; // id -> {name, gender, ig, bullets, pinHash} (invitados agregados desde el panel admin)
  let removedCache = {};     // id -> true (perfiles eliminados por el admin, ocultos de toda la app)
  let syncStatus = FIREBASE_CONFIGURED ? 'connecting' : 'off'; // connecting|live|off

  function isRemoved(id){ return !!removedCache[id]; }

  function initLiveSync(){
    if(!db) return;
    db.collection('profiles').onSnapshot(snap=>{
      const next = {};
      snap.forEach(doc=>{ next[doc.id] = doc.data(); });
      profilesCache = next;
      syncStatus = 'live';
      render();
    }, err=>{ console.error('profiles sync error', err); syncStatus = 'off'; render(); });

    db.collection('swipes').onSnapshot(snap=>{
      const next = {};
      snap.forEach(doc=>{ next[doc.id] = doc.data(); });
      swipesCache = next;
      syncStatus = 'live';
      render();
    }, err=>{ console.error('swipes sync error', err); syncStatus = 'off'; render(); });

    db.collection('guests').onSnapshot(snap=>{
      const next = {};
      snap.forEach(doc=>{ next[doc.id] = Object.assign({id: doc.id}, doc.data()); });
      extraGuestsCache = next;
      syncStatus = 'live';
      render();
    }, err=>{ console.error('guests sync error', err); syncStatus = 'off'; render(); });

    db.collection('removed').onSnapshot(snap=>{
      const next = {};
      snap.forEach(doc=>{ next[doc.id] = true; });
      removedCache = next;
      syncStatus = 'live';
      render();
    }, err=>{ console.error('removed sync error', err); syncStatus = 'off'; render(); });
  }

  function allGuestIds(){ return [...PEOPLE_BASE.map(p=>p.id), ...Object.keys(extraGuestsCache)]; }

  function slugify(str){
    return (str || '').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '') || 'invitado';
  }
  function uniqueGuestId(base){
    const existing = new Set(allGuestIds());
    let id = base, n = 2;
    while(existing.has(id)){ id = base + '_' + n; n++; }
    return id;
  }
  function genPassword(len){
    len = len || 6;
    const alphabet = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    return Array.from(arr, n=>alphabet[n % alphabet.length]).join('');
  }

  function getMergedPeople(){
    const base = [...PEOPLE_BASE, ...Object.values(extraGuestsCache)].filter(p=>!isRemoved(p.id));
    return base.map(p=>{
      const live = profilesCache[p.id];
      if(live){
        return Object.assign({}, p, {
          bio: live.bio || '',
          photos: (live.photos && live.photos.length) ? live.photos : (p.photos || [])
        });
      }
      return Object.assign({}, p, {photos: p.photos || []});
    });
  }

  function authedLocally(id){
    return !!id && localStorage.getItem('ramblero_authed_'+id) === '1';
  }

  const savedMe = localStorage.getItem(LS.me);
  const state = {
    me: authedLocally(savedMe) ? savedMe : null,
    pendingId: null,
    pinError: false,
    screen: 'splash',
    tapCount: 0,
    photoIdx: {},
    draftProfile: null,
    newGuestResult: null
  };

  async function sha256Hex(str){
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  // Ids que nunca aparecen como candidatos para swipear/matchear
  const EXCLUDED_FROM_MATCHES = ['facundo'];

  function people(){ return getMergedPeople(); }
  function personById(id){ return people().find(p=>p.id===id); }
  function others(){
    const me = personById(state.me);
    const myGender = me && me.gender;
    return people().filter(p=>{
      if(p.id === state.me) return false;
      if(EXCLUDED_FROM_MATCHES.includes(p.id)) return false;
      if(!p.photos || !p.photos.length) return false; // sin foto no se muestra
      if(myGender && p.gender) return p.gender !== myGender; // búsqueda hetero
      return true;
    });
  }
  function myLikes(){ return (swipesCache[state.me] && swipesCache[state.me].likes) || []; }
  function myPasses(){ return (swipesCache[state.me] && swipesCache[state.me].passes) || []; }
  function pendingDeck(){
    const seen = new Set([...myLikes(), ...myPasses()]);
    return others().filter(p=>!seen.has(p.id));
  }

  // ---------- MATCH (likes mutuos) ----------
  const myKnownMatches = new Set(); // solo en memoria: si se reinician los likes, puede volver a sonar

  function myMatches(){
    if(!state.me) return [];
    const mine = swipesCache[state.me];
    if(!mine || !mine.likes) return [];
    return mine.likes.filter(id=>{
      const other = swipesCache[id];
      return other && (other.likes || []).includes(state.me);
    });
  }

  function checkForNewMatches(){
    if(!state.me) return;
    myMatches().forEach(id=>{
      if(!myKnownMatches.has(id)){
        myKnownMatches.add(id);
        queueMatchCelebration(personById(id));
      }
    });
  }

  let matchQueue = [];
  let matchShowing = false;
  function queueMatchCelebration(person){
    if(!person) return;
    matchQueue.push(person);
    if(!matchShowing) showNextMatch();
  }
  function showNextMatch(){
    const person = matchQueue.shift();
    if(!person){ matchShowing = false; return; }
    matchShowing = true;
    const overlay = document.createElement('div');
    overlay.className = 'match-overlay';
    const sparkEmojis = ['🔥','❤️','✨','🍺','🔥','❤️'];
    const sparks = sparkEmojis.map((em,i)=>{
      const angle = (Math.PI*2/sparkEmojis.length)*i;
      const dist = 130;
      const tx = Math.round(Math.cos(angle)*dist);
      const ty = Math.round(Math.sin(angle)*dist);
      return `<span class="match-spark" style="--tx:${tx}px;--ty:${ty}px;animation-delay:.05s">${em}</span>`;
    }).join('');
    overlay.innerHTML = `<div class="match-burst">
      ${sparks}
      <div class="match-title">¡Hay rambla!</div>
      <div class="match-sub">con ${esc(person.name)}</div>
    </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(()=> overlay.classList.add('show'));
    setTimeout(()=>{
      overlay.classList.add('hide');
      setTimeout(()=>{
        overlay.remove();
        showNextMatch();
      }, 400);
    }, 2400);
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function initials(name){
    return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  }

  function render(){
    const app = document.getElementById('app');
    checkForNewMatches();

    if(state.screen === 'splash'){
      app.innerHTML = renderSplash();
      bindEvents();
      return;

  // ---------- DECK ----------
  function renderDeck(){
    const deck = pendingDeck();
    const total = others().length;
    const done = total - deck.length;
    const progressPct = total ? Math.round((done/total)*100) : 0;

    if(deck.length === 0){
      state.screen = 'end';
      return renderEnd();
    }

    const cardsHtml = deck.slice(0,3).reverse().map((p,idx,arr)=>{
      const isTop = idx === arr.length-1;
      const depth = arr.length-1-idx;
      const scale = 1 - depth*0.04;
      const translate = depth*10;
      const photos = p.photos && p.photos.length ? p.photos : null;
      const curIdx = Math.min(state.photoIdx[p.id]||0, photos ? photos.length-1 : 0);
      const photo = photos ? `<img id="${isTop?'cardPhotoImg':''}" src="${photos[curIdx]}">` : `<div class="avatar-fallback">${esc(initials(p.name))}</div>`;
      const dots = (isTop && photos && photos.length>1) ? `<div class="dots-row">${photos.map((_,i)=>`<div class="dot ${i===curIdx?'active':''}"></div>`).join('')}</div>` : '';
      const tapZones = (isTop && photos && photos.length>1) ? `<div class="tap-zone left" id="tapPrevPhoto"></div><div class="tap-zone right" id="tapNextPhoto"></div>` : '';
      const bullets = (p.bullets && p.bullets.length) ? p.bullets : (p.bio ? p.bio.split(/[·\-\n]/).map(s=>s.trim()).filter(Boolean) : []);
      const mystery = (!p.bullets || p.bullets.length===0) && !p.bio;
      return `<div class="swipe-card" style="z-index:${idx};transform:translateY(${translate}px) scale(${scale});" ${isTop?'id="topCard"':''} data-id="${p.id}">
        <div class="photo-area">
          ${photo}
          ${dots}
          ${tapZones}
          ${isTop?'<div class="stamp stamp-like" id="stampLike">LIKE</div><div class="stamp stamp-pass" id="stampPass">PASO</div>':''}
          ${mystery?'<div class="mystery-tag">🕵️ Perfil misterioso — mirá su Instagram</div>':''}
        </div>
        <div class="info-area">
          <div class="p-name">${esc(p.name)}</div>
          <ul class="p-bullets">${bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
          <a class="ig-link" href="https://instagram.com/${encodeURIComponent(p.ig)}" target="_blank" rel="noopener">📷 @${esc(p.ig)}</a>
        </div>
      </div>`;
    }).join('');

    return `<div class="screen">
      <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="deck-wrap">${cardsHtml}</div>
      <div class="deck-actions">
        <div class="round-btn pass" id="passBtn">✕</div>
        <div class="round-btn like" id="likeBtn">❤</div>
      </div>
      <span class="backlink" id="viewMatchesLink">Ver mis matches${myMatches().length ? ' 🔥 ('+myMatches().length+')' : ''}</span>
      <span class="backlink" id="editProfileLink">Editar mi perfil</span>
    </div>`;
  }

  function swipeDecide(liked){
    const deck = pendingDeck();
    if(!deck.length) return;
    const p = deck[0];
    const me = personById(state.me);
    const cur = swipesCache[state.me] || {likes:[], passes:[]};
    const nextCur = Object.assign({}, cur, {name: me.name});
    if(liked) nextCur.likes = [...(cur.likes||[]), p.id];
    else nextCur.passes = [...(cur.passes||[]), p.id];
    swipesCache[state.me] = nextCur;
    render();
    if(db){
      const field = liked ? 'likes' : 'passes';
      const payload = {name: me.name, updatedAt: firebase.firestore.FieldValue.serverTimestamp()};
      payload[field] = firebase.firestore.FieldValue.arrayUnion(p.id);
      ensureAuth().then(()=> db.collection('swipes').doc(state.me).set(payload, {merge:true}))
        .catch(e=>console.error('No se pudo guardar el swipe', e));
    }
  }

  function attachDrag(){
    const card = document.getElementById('topCard');
    if(!card) return;
    let startX=0, startY=0, curX=0, curY=0, dragging=false;
    const likeStamp = document.getElementById('stampLike');
    const passStamp = document.getElementById('stampPass');

    function pointerDown(e){
      dragging = true;
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX; startY = pt.clientY;
    }
    function pointerMove(e){
      if(!dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      curX = pt.clientX - startX;
      curY = pt.clientY - startY;
      const rot = curX / 20;
      card.style.transform = `translate(${curX}px, ${curY}px) rotate(${rot}deg)`;
      if(likeStamp) likeStamp.style.opacity = Math.min(Math.max(curX/80,0),1);
      if(passStamp) passStamp.style.opacity = Math.min(Math.max(-curX/80,0),1);
    }
    function pointerUp(){
      if(!dragging) return;
      dragging = false;
      if(curX > 100){
        flyOut(1);
      } else if(curX < -100){
        flyOut(-1);
      } else {
        card.style.transition = 'transform .25s ease';
        card.style.transform = '';
        if(likeStamp) likeStamp.style.opacity = 0;
        if(passStamp) passStamp.style.opacity = 0;
      }
      curX = 0; curY = 0;
    }
    function flyOut(dir){
      card.style.transition = 'transform .35s ease';
      card.style.transform = `translate(${dir*600}px, ${curY}px) rotate(${dir*30}deg)`;
      setTimeout(()=>swipeDecide(dir===1), 260);
    }

    card.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    card.addEventListener('touchstart', pointerDown, {passive:true});
    card.addEventListener('touchmove', pointerMove, {passive:true});
    card.addEventListener('touchend', pointerUp);
  }

  function computeDashboardLines(){
    const lines = [];
    Object.keys(swipesCache).forEach(id=>{
      const s = swipesCache[id];
      (s.likes||[]).forEach(otherId=>{
        const other = swipesCache[otherId];
        const person = personById(otherId);
        const otherName = person ? person.name : otherId;
        const mutual = !!(other && (other.likes||[]).includes(id));
        lines.push({from: s.name || id, to: otherName, toIg: person ? person.ig : '', mutual});
      });
    });
    return lines;
  }

  function resetLikesOnly(){
    if(!db) return;
    const ok = confirm('¿Reiniciar los likes y pases de todos los invitados? Los perfiles y fotos se mantienen. No se puede deshacer.');
    if(!ok) return;
    db.collection('swipes').get()
      .then(snap=>Promise.all(snap.docs.map(d=>d.ref.delete())))
      .then(()=>{ alert('Listo, los likes se reiniciaron.'); })
      .catch(e=>{ console.error(e); alert('Algo falló al reiniciar. Mirá la consola.'); });
  }

  // ---------- EVENTS ----------
  function bindEvents(){
    const q = sel => document.querySelector(sel);
    const qa = sel => document.querySelectorAll(sel);

    const enterSplashBtn = q('#enterSplashBtn');
    if(enterSplashBtn) enterSplashBtn.addEventListener('click', ()=>{ state.screen='login'; render(); });

    const nameSearch = q('#nameSearch');
    const nameResults = q('#nameResults');
    if(nameSearch && nameResults){
      const renderResults = (query)=>{
        const query2 = query.trim().toLowerCase();
        if(!query2){ nameResults.innerHTML = ''; return; }
        const all = [...PEOPLE_BASE, ...Object.values(extraGuestsCache)];
        const matches = all.filter(p=>!isRemoved(p.id) && p.name.toLowerCase().includes(query2)).slice(0, 8);
        nameResults.innerHTML = matches.length
          ? matches.map(p=>`<div class="name-btn" data-select="${p.id}">${esc(p.name)}</div>`).join('')
          : '<div class="empty-note">No encontramos ese nombre.</div>';
      };
      nameSearch.addEventListener('input', e=>renderResults(e.target.value));
      nameResults.addEventListener('click', e=>{
        const el = e.target.closest('[data-select]');
        if(!el) return;
        state.pendingId = el.getAttribute('data-select');
        state.pinError = false;
        state.screen = 'pin';
        render();
      });
      nameSearch.focus();
    }

    const pinInput = q('#pinInput');
    const pinSubmitBtn = q('#pinSubmitBtn');
    if(pinSubmitBtn){
      const submitPin = async ()=>{
        const val = (q('#pinInput').value || '').trim();
        const p = personById(state.pendingId);
        const hash = val ? await sha256Hex(val) : '';
        if(p && p.pinHash && hash === p.pinHash){
          state.me = state.pendingId;
          state.pendingId = null;
          state.pinError = false;
          localStorage.setItem(LS.me, state.me);
          localStorage.setItem('ramblero_authed_'+state.me, '1');
          state.draftProfile = null;
          state.screen = 'profile';
          render();
        } else {
          state.pinError = true;
          render();
          const retryInput = q('#pinInput');
          if(retryInput) retryInput.focus();
        }
      };
      pinSubmitBtn.addEventListener('click', submitPin);
      if(pinInput) pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submitPin(); });
    }
    if(pinInput) pinInput.focus();

    const backToLogin = q('#backToLogin');
    if(backToLogin) backToLogin.addEventListener('click', ()=>{ state.pendingId=null; state.pinError=false; state.screen='login'; render(); });

    const editProfileLink = q('#editProfileLink');
    if(editProfileLink) editProfileLink.addEventListener('click', ()=>{ state.draftProfile = null; state.screen='profile'; render(); });

    const viewMatchesLink = q('#viewMatchesLink');
    if(viewMatchesLink) viewMatchesLink.addEventListener('click', ()=>{ state.screen='matches'; render(); });

    const backFromMatches = q('#backFromMatches');
    if(backFromMatches) backFromMatches.addEventListener('click', ()=>{ state.screen = pendingDeck().length ? 'deck' : 'end'; render(); });

    // Profile screen
    const addPhotoBtn = q('#addPhotoBtn');
    const photoInput = q('#photoInput');
    if(addPhotoBtn && photoInput){
      addPhotoBtn.addEventListener('click', ()=>photoInput.click());
      photoInput.addEventListener('change', (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const img = new Image();
        const reader = new FileReader();
        reader.onload = ev=>{
          img.onload = ()=>{
            const canvas = document.createElement('canvas');
            const maxW = 480;
            const scale = Math.min(1, maxW/img.width);
            canvas.width = img.width*scale; canvas.height = img.height*scale;
            canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            if(!state.draftProfile) state.draftProfile = {bio:'', photos:[]};
            state.draftProfile.photos = state.draftProfile.photos || [];
            if(state.draftProfile.photos.length < 3) state.draftProfile.photos.push(dataUrl);
            render();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    qa('[data-rmphoto]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = parseInt(el.getAttribute('data-rmphoto'),10);
        if(state.draftProfile && state.draftProfile.photos) state.draftProfile.photos.splice(idx,1);
        render();
      });
    });
    const saveProfileBtn = q('#saveProfileBtn');
    if(saveProfileBtn){
      saveProfileBtn.addEventListener('click', ()=>{
        const bio = q('#bioInput').value;
        const draft = state.draftProfile || {photos:[]};
        draft.bio = bio;
        const me = personById(state.me);
        profilesCache[state.me] = {name: me.name, bio: draft.bio, photos: draft.photos||[]};
        state.draftProfile = null;
        state.screen = 'deck';
        render();
        if(db){
          ensureAuth().then(()=> db.collection('profiles').doc(state.me).set({
            name: me.name,
            bio: draft.bio || '',
            photos: draft.photos || [],
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, {merge:true})).catch(e=>console.error('No se pudo guardar el perfil', e));
        }
      });
    }

    // Deck screen
    attachDrag();
    const likeBtn = q('#likeBtn');
    const passBtn = q('#passBtn');
    if(likeBtn) likeBtn.addEventListener('click', ()=>swipeDecide(true));
    if(passBtn) passBtn.addEventListener('click', ()=>swipeDecide(false));

    const tapPrev = q('#tapPrevPhoto');
    const tapNext = q('#tapNextPhoto');
    if(tapPrev || tapNext){
      const deck = pendingDeck();
      const p = deck[0];
      const photos = p.photos || [];
      const changePhoto = (dir)=>{
        const cur = state.photoIdx[p.id] || 0;
        const next = Math.max(0, Math.min(photos.length-1, cur+dir));
        state.photoIdx[p.id] = next;
        const img = q('#cardPhotoImg');
        if(img) img.src = photos[next];
        qa('.dots-row .dot').forEach((d,i)=>d.classList.toggle('active', i===next));
      };
      if(tapPrev) tapPrev.addEventListener('click', ()=>changePhoto(-1));
      if(tapNext) tapNext.addEventListener('click', ()=>changePhoto(1));
    }

    // Admin unlock via 5 taps on title
    const titleTap = q('#titleTap');
    if(titleTap){
      titleTap.addEventListener('click', ()=>{
        state.tapCount = (state.tapCount||0)+1;
        if(state.tapCount>=5){
          state.tapCount = 0;
          state.screen = 'admin';
          render();
        }
      });
    }
    const adminLoginBtn = q('#adminLoginBtn');
    if(adminLoginBtn){
      adminLoginBtn.addEventListener('click', ()=>{
        const val = q('#adminPassInput').value;
        if(val === ADMIN_PASS){
          state.adminAuthed = true;
          render();
        } else {
          alert('Contraseña incorrecta');
        }
      });
    }
    const revealMatchesBtn = q('#revealMatchesBtn');
    if(revealMatchesBtn){
      revealMatchesBtn.addEventListener('click', ()=>{
        const lines = computeDashboardLines();
        const area = q('#matchesArea');
        area.innerHTML = lines.length
          ? lines.map(l=>{
              const igLink = (l.mutual && l.toIg) ? ` <a class="ig-link" href="https://instagram.com/${encodeURIComponent(l.toIg)}" target="_blank" rel="noopener">📷 @${esc(l.toIg)}</a>` : '';
              return `<div class="likeline ${l.mutual?'match':''}">${l.mutual?'🔥 ':''}${esc(l.from)} le dio like a ${esc(l.to)}${igLink}</div>`;
            }).join('')
          : '<div class="empty-note">Todavía no hay likes.</div>';
      });
    }
    const resetLikesBtn = q('#resetLikesBtn');
    if(resetLikesBtn) resetLikesBtn.addEventListener('click', resetLikesOnly);

    const addGuestBtn = q('#addGuestBtn');
    if(addGuestBtn){
      addGuestBtn.addEventListener('click', async ()=>{
        const nameInput = q('#newGuestName');
        const genderSelect = q('#newGuestGender');
        const igInput = q('#newGuestIg');
        const name = (nameInput.value || '').trim();
        const gender = genderSelect.value;
        const ig = (igInput.value || '').trim().replace(/^@/, '');
        if(!name || !gender){ alert('Completá nombre y género.'); return; }
        if(!db){ alert('Sync no configurado: no se puede agregar invitados en vivo.'); return; }
        const id = uniqueGuestId(slugify(name));
        const password = genPassword();
        addGuestBtn.disabled = true;
        try{
          const pinHash = await sha256Hex(password);
          await ensureAuth();
          await db.collection('guests').doc(id).set({
            name, gender, ig, bullets: [], pinHash,
            addedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          state.newGuestResult = {name, password};
          render();
        }catch(e){
          console.error('No se pudo agregar el invitado', e);
          alert('Algo falló al agregar: ' + (e && e.message ? e.message : e) + '\n\n(Si dice "permission-denied", falta agregar la regla de Firestore para la colección "guests".)');
        }
        addGuestBtn.disabled = false;
      });
    }

    qa('[data-remove-guest]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const id = el.getAttribute('data-remove-guest');
        const person = personById(id);
        const ok = confirm(`¿Eliminar a ${person ? person.name : id} de la lista? Ya no va a aparecer para nadie. No se puede deshacer.`);
        if(!ok || !db) return;
        try{
          await ensureAuth();
          await db.collection('removed').doc(id).set({removedAt: firebase.firestore.FieldValue.serverTimestamp()});
        }catch(e){
          console.error('No se pudo eliminar', e);
          alert('Algo falló al eliminar: ' + (e && e.message ? e.message : e));
        }
      });
    });
  }

  // Initial screen
  if(state.me) state.screen = 'deck';
  initLiveSync();
  render();
})();
</script>
</body>
</html>
